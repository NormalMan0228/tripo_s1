[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="tripothon_player"
export_filter="all_resources"
include_filter="i18n/*.json,maps/archipelago/*.json,maps/survival/*.json,maps/survival/assets/*.json,assets/interior/*.json,assets/monsters/*.json"
exclude_filter="tests/*,scenes/village.tscn,scripts/village.gd"
export_path="../builds/windows/Villagen.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug="../.tools/godot-templates/windows_debug_x86_64.exe"
custom_template/release="../.tools/godot-templates/windows_release_x86_64.exe"
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/bptc=false
texture_format/s3tc=true
texture_format/etc2=false
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/starseed.svg"
application/file_version="0.11.0.0"
application/product_version="0.11.0.0"
application/company_name="Villagen"
application/product_name="Villagen"
application/file_description="Villagen"

