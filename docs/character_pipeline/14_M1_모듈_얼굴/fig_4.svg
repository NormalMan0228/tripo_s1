<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 860 300" role="img" aria-label="눈 부품 2판 방법"><style>
text{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.s-ink{fill:#1B1F27}.s-muted{fill:#5B6473}.s-paper{fill:#fff}.s-soft{fill:#EEF1F6}.s-acc{fill:#2F5BD3}.s-good{fill:#1E8A52}.s-bad{fill:#C83A32}.s-warn{fill:#B26A00}
.st-acc{stroke:#2F5BD3}.st-good{stroke:#1E8A52}.st-ink{stroke:#1B1F27}.st-muted{stroke:#5B6473}.st-bad{stroke:#C83A32}.st-warn{stroke:#B26A00}
</style>
 <defs><marker id="ar2" viewbox="0 0 10 10" refx="9" refy="5" markerwidth="7" markerheight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="s-muted"/></marker></defs>
 <g font-size="12.5">
  <text x="10" y="20" class="s-ink" font-weight="600">① 광선 좌표 (옆에서 본 모습)</text>
  <path d="M30 150 C 90 40, 220 40, 270 150" fill="none" class="st-muted" stroke-width="2"/>
  <text x="208" y="62" class="s-muted">머리 표면</text>
  <circle cx="150" cy="150" r="55" class="s-soft st-acc" stroke-width="1.5"/>
  <text x="150" y="190" text-anchor="middle" class="s-acc">안구</text>
  <circle cx="150" cy="150" r="3" class="s-ink"/><text x="158" y="163" class="s-ink" font-size="11">C</text>
  <circle cx="150" cy="205" r="4" class="s-bad"/><text x="160" y="222" class="s-bad" font-size="11.5">Q (안구 반지름만큼 뒤)</text>
  <path d="M150 205 L60 62 M150 205 L110 48 M150 205 L150 44 M150 205 L190 48 M150 205 L240 62" class="st-bad" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="10" y="260" class="s-muted">Q에서 쏜 광선은 표면을 한 번만 만남 →</text>
  <text x="10" y="278" class="s-muted">옆으로 감싼 큰 눈도 펼칠 수 있음</text>

  <text x="300" y="20" class="s-ink" font-weight="600">② 구멍 곡선 (각도마다 줄임)</text>
  <ellipse cx="420" cy="140" rx="100" ry="70" fill="none" class="st-muted" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M520 140 C 520 185, 470 210, 420 210 C 370 210, 345 185, 345 160 C 345 130, 330 110, 350 90 C 370 74, 395 70, 420 70 C 475 70, 520 95, 520 140 Z" fill="none" class="st-acc" stroke-width="2.2"/>
  <path d="M370 140 C 390 112, 450 112, 470 140 C 450 160, 390 160, 370 140 Z" class="s-paper st-ink" stroke-width="1.5"/>
  <text x="420" y="145" text-anchor="middle" class="s-ink" font-size="11">눈꺼풀 가장자리</text>
  <text x="300" y="250" class="s-muted">점선: 처음 타원 · 파랑: 코 옆을 넘지 않게 줄인 곡선</text>
  <text x="300" y="268" class="s-muted">곡선 위 표면점과 가장자리 사이 3D 거리 ≤ 띠×1.3 + 1.5mm</text>

  <text x="600" y="20" class="s-ink" font-weight="600">③ 지퍼 잇기</text>
  <g class="st-muted" stroke-width="1">
   <path d="M610 70 L640 66 L668 72 L690 64 L720 70 L748 66 L780 72 L810 68 L840 70" fill="none" class="st-ink" stroke-width="1.8"/>
   <path d="M615 130 L695 130 L775 130 L840 130" fill="none" class="st-acc" stroke-width="1.8"/>
   <path d="M610 70 L615 130 M640 66 L615 130 M668 72 L615 130 M668 72 L695 130 M690 64 L695 130 M720 70 L695 130 M748 66 L695 130 M748 66 L775 130 M780 72 L775 130 M810 68 L775 130 M810 68 L840 130 M840 70 L840 130" fill="none"/>
  </g>
  <text x="610" y="55" class="s-ink" font-size="11.5">구멍 테두리 (점 수 제각각)</text>
  <text x="610" y="150" class="s-acc" font-size="11.5">첫 고리 (64점 고정)</text>
  <text x="600" y="190" class="s-muted">각도 순서대로 다음 점이 먼저 오는 쪽을</text>
  <text x="600" y="208" class="s-muted">한 칸씩 전진 → 삼각형이 접히지 않음</text>
  <text x="600" y="240" class="s-muted">④ 깊이: 여러 표면 중 예상값에 가까운 것</text>
  <text x="600" y="258" class="s-muted">⑤ 깊이 격자를 부드럽게 (울퉁불퉁 제거)</text>
  <text x="600" y="276" class="s-muted">⑥ 감기: 같은 가로 위치끼리 만남</text>
 </g>
</svg>