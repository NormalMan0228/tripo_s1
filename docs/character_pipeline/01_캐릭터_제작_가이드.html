<title>캐릭터 제작 파이프라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: type switcher on top, numbered step rail (left on desktop, chip strip on phone), one step's detail sheet at a time */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#1A1E26; --muted:#5A6372; --line:#DCE1E8;
  --human:#5446CF; --hmon:#A86200; --beast:#0B7A63;
  --ok:#1F8A4C; --now:#D23F3A; --plan:#8A93A2;
  --accent:var(--human);
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141A; --surface:#191D25; --ink:#E6E9EF; --muted:#9CA5B4; --line:#2B313C;
  --human:#A99EFF; --hmon:#F0AE48; --beast:#4ED0AC; --ok:#5BD08B; --now:#FF6B63; --plan:#7D8696; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#191D25; --ink:#E6E9EF; --muted:#9CA5B4; --line:#2B313C;
  --human:#A99EFF; --hmon:#F0AE48; --beast:#4ED0AC; --ok:#5BD08B; --now:#FF6B63; --plan:#7D8696; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header h1{font-size:clamp(22px,4vw,30px);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.legend{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.done{background:var(--ok)} .dot.now{background:var(--now)} .dot.plan{background:transparent;border:1.5px solid var(--plan)}

/* type switcher */
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 10px}
.type{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;min-width:0}
.type .k{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-family:var(--f-mono)}
.type .n{display:block;font-weight:700;font-size:15.5px;margin-top:2px}
.type .e{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.type .bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.type .bar i{display:block;height:100%;background:var(--c)}
.type[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.type:focus-visible,.step:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.route{font-size:13.5px;color:var(--muted);margin:0 0 14px;padding:9px 12px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:0 8px 8px 0}
.route b{color:var(--ink)}

/* body grid */
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 20px);overflow:auto;padding:4px}
.step{appearance:none;font:inherit;color:var(--ink);background:none;border:0;border-radius:8px;padding:7px 9px;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;cursor:pointer}
.step .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.step .t{font-size:14px;line-height:1.35;min-width:0}
.step .t small{display:block;color:var(--muted);font-size:11.5px}
.step:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.step[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.step[aria-selected="true"] .no{color:var(--accent);font-weight:500}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px 16px;min-width:0}
.sheet .eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.pill{font-family:var(--f-body);font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.pill.done{color:var(--ok)} .pill.now{color:var(--now)} .pill.plan{color:var(--plan)}
.sheet h2{font-size:21px;margin:6px 0 2px;text-wrap:balance;line-height:1.3}
.sheet .goal{color:var(--muted);margin:0 0 12px;max-width:68ch}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.tools li{font-size:12.5px;padding:2px 9px;border-radius:6px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));color:var(--ink)}
.sec{margin-top:16px}
.sec h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;font-weight:600}
ol.do{margin:0;padding-left:22px;max-width:72ch}
ol.do li{margin:3px 0}
ol.do li::marker{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
ul.chk{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-width:72ch}
ul.chk li{padding-left:22px;position:relative}
ul.chk li::before{content:"";position:absolute;left:2px;top:.42em;width:11px;height:11px;border:1.5px solid var(--ok);border-radius:3px}
ul.warn{margin:0;padding-left:18px;max-width:72ch}
ul.warn li{margin:3px 0}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
code,.mono{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
code{background:color-mix(in srgb,var(--ink) 6%,transparent);padding:1px 5px;border-radius:4px}
.files{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.files li{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere;padding:5px 8px;border:1px dashed var(--line);border-radius:6px}
.cost{display:flex;gap:10px;align-items:baseline;font-size:14px}
.cost .num{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:16px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.nav button{appearance:none;font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;max-width:48%;text-align:left;min-width:0}
.nav button[disabled]{opacity:.4;cursor:default}
.nav .next{text-align:right;margin-left:auto}
.nav small{display:block;color:var(--muted);font-size:11.5px}

@media (max-width:760px){
  .types{grid-template-columns:1fr;gap:6px}
  .type .e{display:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;flex-direction:row;overflow-x:auto;max-height:none;background:var(--bg);padding:6px 0;margin-inline:-16px;padding-inline:16px;gap:6px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .step{grid-template-columns:auto auto;gap:5px;border:1px solid var(--line);background:var(--surface);flex:none;padding:5px 10px}
  .step .t small{display:none}
  .step .t{white-space:nowrap;font-size:13px}
  .step .no{text-align:left}
  .step .st{display:none}
  .sheet{padding:15px 14px}
  .kv{grid-template-columns:minmax(0,1fr)} .kv dd{margin-bottom:6px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<div class="wrap">
  <header>
    <h1>캐릭터 제작 파이프라인</h1>
    <p>유형을 고르고, 왼쪽(휴대폰은 위쪽) 단계를 눌러 하나씩 보세요. 2026-10-11 기준 실제로 해 본 설정과 수치입니다. 얼굴은 CC5 대신 애니메이션 템플릿 랩핑으로 바꿔 시험했습니다(인간형 캐릭터 5·6단계).</p>
    <div class="meta">
      <span class="legend"><span class="dot done"></span>완료</span>
      <span class="legend"><span class="dot now"></span>지금 하는 중</span>
      <span class="legend"><span class="dot plan"></span>예정</span>
      <span>우선순위 <b>얼굴 워크플로우 → 파츠 분리·일체화 → 얼굴 → 헤어 → 바디 → 애니메이션</b></span>
    </div>
  </header>

  <div class="types" role="tablist" id="types" aria-label="캐릭터 유형"></div>
  <p class="route" id="route"></p>

  <div class="grid">
    <nav class="rail" id="rail" role="tablist" aria-label="단계"></nav>
    <article class="sheet" id="sheet" aria-live="polite"></article>
  </div>
</div>

<script>

        tools:["CHARACTER_GENERATION_POLICY.json"],
        do:["캐릭터 한 줄 설정: 이름, 역할(주인공/NPC), 머리 대 몸 비율, 얼굴에서 드러나야 할 특징.",
            "기본 몸은 불투명 속옷만 입힌 맨몸. 게임 안에서도 속옷은 항상 남김(심의 기준).",

        cost:["15","크레딧/회. 유료 생성은 레퍼런스 검토 후, 승인 한도 안에서(현재 150 중 15 사용)."] },

      { t:"얼굴 리그: 애니 템플릿 랩핑", s:"Tripo 모양 + 애니메이션 눈·입 표정", st:"now",

const ST = {done:"완료", now:"지금 하는 중", plan:"예정"};
const $ = s => document.querySelector(s);
let cur = {type:"human", i:4};
try { const sv = JSON.parse(localStorage.getItem("cpg") || "null"); if (sv && TYPES[sv.type]) cur = sv; } catch(e) {}
const h = location.hash.slice(1).match(/^(human|hmon|beast)-(\d+)$/);
if (h) cur = {type:h[1], i:Math.max(0, +h[2]-1)};

function renderTypes(){
  $("#types").innerHTML = Object.entries(TYPES).map(([k,T])=>{
    const n=T.steps.length, d=T.steps.filter(s=>s.st==="done").length;
    return `<button class="type" role="tab" id="tab-${k}" aria-selected="${k===cur.type}" data-k="${k}" style="--c:var(${T.color})">
      <span class="k">${T.key}</span><span class="n">${T.name}</span><span class="e">${T.ex} · ${d}/${n} 완료</span>
      <span class="bar"><i style="width:${Math.round(100*d/n)}%"></i></span></button>`;
  }).join("");
}
function renderRail(){
  const T=TYPES[cur.type];
  document.documentElement.style.setProperty("--accent", `var(${T.color})`);
  $("#route").innerHTML=T.route;
  $("#rail").innerHTML=T.steps.map((s,i)=>`<button class="step" role="tab" aria-selected="${i===cur.i}" data-i="${i}">
     <span class="no">${String(i+1).padStart(2,"0")}</span><span class="t">${s.t}<small>${s.s}</small></span><span class="st dot ${s.st}" title="${ST[s.st]}"></span></button>`).join("");
  const sel=$("#rail .step[aria-selected='true']"); if(sel) sel.scrollIntoView({block:"nearest",inline:"center"});
}
function renderSheet(){
  const T=TYPES[cur.type], s=T.steps[cur.i], n=T.steps.length;
  const list=(a,cls,tag="ul")=>`<${tag} class="${cls}">${a.map(x=>`<li>${x}</li>`).join("")}</${tag}>`;
  let html=`<div class="eyebrow"><span>${T.name} · ${cur.i+1} / ${n}단계</span><span class="pill ${s.st}">${ST[s.st]}</span></div>
    <h2>${s.t}</h2><p class="goal">${s.goal}</p>`;
  if(s.tools) html+=list(s.tools,"tools");
  if(s.do) html+=`<div class="sec"><h3>순서</h3>${list(s.do,"do","ol")}</div>`;
  if(s.kv) html+=`<div class="sec"><h3>설정값</h3><dl class="kv">${s.kv.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>`;
  if(s.files) html+=`<div class="sec"><h3>결과 파일</h3>${list(s.files,"files")}</div>`;
  if(s.chk) html+=`<div class="sec"><h3>통과 기준</h3>${list(s.chk,"chk")}</div>`;
  if(s.cost) html+=`<div class="sec"><h3>비용</h3><div class="cost"><span class="num">${s.cost[0]}</span><span>${s.cost[1]}</span></div></div>`;
  if(s.warn) html+=`<div class="sec"><h3>주의</h3>${list(s.warn,"warn")}</div>`;
  if(s.note) html+=`<p class="note">${s.note}</p>`;
  const p=T.steps[cur.i-1], q=T.steps[cur.i+1];
  html+=`<div class="nav"><button class="prev" ${p?"":"disabled"} data-d="-1"><small>이전</small>${p?p.t:"처음"}</button>
    <button class="next" ${q?"":"disabled"} data-d="1"><small>다음</small>${q?q.t:"끝"}</button></div>`;
  $("#sheet").innerHTML=html;
}
function go(type,i,scroll){
  cur={type,i}; renderTypes(); renderRail(); renderSheet();
  try{ localStorage.setItem("cpg", JSON.stringify(cur)); }catch(e){}
  try{ history.replaceState(null,"",`#${type}-${i+1}`); }catch(e){}
  if(scroll && window.matchMedia("(max-width:760px)").matches) $("#rail").scrollIntoView({block:"start",behavior:"smooth"});
}
$("#types").addEventListener("click",e=>{const b=e.target.closest(".type"); if(b){ const k=b.dataset.k; go(k, k===cur.type?cur.i:Math.max(0,TYPES[k].steps.findIndex(s=>s.st==="now")) ); }});
$("#rail").addEventListener("click",e=>{const b=e.target.closest(".step"); if(b) go(cur.type,+b.dataset.i);});
$("#sheet").addEventListener("click",e=>{const b=e.target.closest(".nav button"); if(b&&!b.disabled) go(cur.type,cur.i+(+b.dataset.d),true);});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea")) return;
  const n=TYPES[cur.type].steps.length;
  if(e.key==="ArrowDown"||e.key==="ArrowRight"){ if(cur.i<n-1){go(cur.type,cur.i+1); e.preventDefault();} }
  if(e.key==="ArrowUp"||e.key==="ArrowLeft"){ if(cur.i>0){go(cur.type,cur.i-1); e.preventDefault();} }
});
if(!TYPES[cur.type].steps[cur.i]) cur.i=0;
go(cur.type,cur.i);
</script>
