services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    expose: ["8765"]
    environment:
      TRIPOTHON_MODE: live
      TRIPOTHON_DATA_DIR: /data
      TRIPOTHON_STUDIO_LLM: fixture
      TRIPOTHON_DESIGN_FORMAT: structured
      TRIPOTHON_REGISTRATION_CODE_FILE: /run/secrets/registration_code
      TRIPO_ENABLE_PAID: "false"
      TRIPO_DAILY_REQUEST_LIMIT: ${TRIPO_DAILY_REQUEST_LIMIT:-5}
      TRIPO_USER_DAILY_REQUEST_LIMIT: ${TRIPO_USER_DAILY_REQUEST_LIMIT:-2}
      TRIPO_RESERVE_PER_JOB: ${TRIPO_RESERVE_PER_JOB:-200}
      TRIPOTHON_STARS_PER_CREDIT: ${TRIPOTHON_STARS_PER_CREDIT:-1}
      TRIPO_USER_TOTAL_REQUEST_LIMIT: ${TRIPO_USER_TOTAL_REQUEST_LIMIT:-0}
      TRIPOTHON_WELCOME_STARS: ${TRIPOTHON_WELCOME_STARS:-0}
      # Selling at the village shop: one starseed per N leaf coins, at most this many a day (0 = off).
      TRIPOTHON_SELL_STARS_DAILY: ${TRIPOTHON_SELL_STARS_DAILY:-15}
      TRIPOTHON_SELL_COINS_PER_STAR: ${TRIPOTHON_SELL_COINS_PER_STAR:-3}
      # Residents' requests: their starseed rewards times this (server/quests.py STARS; 0 = off).
      TRIPOTHON_QUEST_STARS_SCALE: ${TRIPOTHON_QUEST_STARS_SCALE:-1.0}
      # The trial game has no invitation field: sign-up is open by default (limited per address/day).
      TRIPOTHON_OPEN_REGISTRATION: ${TRIPOTHON_OPEN_REGISTRATION:-true}
      # Trial cap on Tripo credits per craft: 10 = one untextured H3 mesh from text.
      TRIPOTHON_MAX_CREDITS_PER_CRAFT: ${TRIPOTHON_MAX_CREDITS_PER_CRAFT:-10}
      TRIPOTHON_TRIPO_CREDIT_BUDGET: ${TRIPOTHON_TRIPO_CREDIT_BUDGET:-0}
      TRIPOTHON_SIGNUPS_PER_IP_DAY: ${TRIPOTHON_SIGNUPS_PER_IP_DAY:-3}
      TRIPOTHON_SIGNUPS_PER_DAY: ${TRIPOTHON_SIGNUPS_PER_DAY:-200}
      # The cost monitor's read-only usage key (TRIPOTHON_USAGE_KEY_FILE) comes from
      # ops/compose.usage.yaml once ops/usage_key.sh has made ops/secrets/usage-key.
      # The commit /health reports next to the version (ops/update_online_server.sh sets it).
      VILLAGEN_SERVER_COMMIT: ${VILLAGEN_SERVER_COMMIT:-}
      # Social layer (docs/design/SOCIAL_API.md, section 8); defaults as in server/config.py.
      # Set them in the env file (ops/production.env); compose passes only the variables listed here.
      VILLAGEN_GLOBAL_CHAT: ${VILLAGEN_GLOBAL_CHAT:-on}
      VILLAGEN_SOCIAL_ROSTER: ${VILLAGEN_SOCIAL_ROSTER:-all}
      VILLAGEN_CHAT_FILTER_EXTRA: ${VILLAGEN_CHAT_FILTER_EXTRA:-}
      VILLAGEN_CHAT_IP_PER_MINUTE: ${VILLAGEN_CHAT_IP_PER_MINUTE:-600}
      VILLAGEN_CHAT_RETENTION_HOURS: ${VILLAGEN_CHAT_RETENTION_HOURS:-24}
      VILLAGEN_PRESENCE_TOGETHER: ${VILLAGEN_PRESENCE_TOGETHER:-0.25}
      VILLAGEN_PRESENCE_ALONE: ${VILLAGEN_PRESENCE_ALONE:-1}
      VILLAGEN_PEOPLE_SECONDS: ${VILLAGEN_PEOPLE_SECONDS:-5}
      VILLAGEN_PRESENCE_BUDGET: ${VILLAGEN_PRESENCE_BUDGET:-60}
    secrets: [registration_code]
    volumes:
      - game_data:/data
      - backups:/backups
    networks:
      backend:
        ipv4_address: 172.30.72.3
    command:
      - python
      - -m
      - uvicorn
      - server.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --workers
      - "1"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.30.72.2

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TRIPOTHON_DOMAIN: ${TRIPOTHON_DOMAIN:?Set TRIPOTHON_DOMAIN in ops/production.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Extra site blocks (the development server's, see ops/install_staging.sh); empty by default.
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: 172.30.72.2
      staging:
        ipv4_address: 172.30.73.2

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.72.0/28
  # Only the proxy and the development server (ops/compose.staging.yaml) join this one, so the
  # development server never reaches the production API. Unused while no development server runs.
  staging:
    name: villagen_staging_edge
    ipam:
      config:
        - subnet: 172.30.73.0/28

volumes:
  game_data:
  backups:
  caddy_data:
  caddy_config:

secrets:
  registration_code:
    file: ./secrets/registration-code
